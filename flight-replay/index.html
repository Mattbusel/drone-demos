<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Log Replay</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#121823; --panel2:#0e141d; --line:#1e2836;
    --ink:#e6edf3; --muted:#8b98a9; --faint:#5a6676;
    --accent:#38bdf8; --accent2:#22d3ee;
    --alt:#60a5fa; --spd:#34d399; --bat:#fbbf24;
    --warn:#f59e0b; --alarm:#f43f5e; --ok:#34d399;
    --mono:'SFMono-Regular',ui-monospace,'Cascadia Code','Consolas',monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{padding:18px 16px 40px;max-width:1240px;margin:0 auto}
  a{color:var(--accent)}
  .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:4px}
  h1{font-size:19px;letter-spacing:.14em;font-weight:700;margin:0;text-transform:uppercase}
  .sub{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
  .badge{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:7px 11px;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    display:flex;gap:7px;align-items:center;white-space:nowrap}
  .badge b{color:var(--ink);font-weight:600}
  .badge .ok{color:var(--ok)}
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .panel .cap{padding:9px 13px;border-bottom:1px solid var(--line);font-size:11px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
    display:flex;justify-content:space-between;align-items:center}
  .trackwrap{position:relative;background:
    radial-gradient(900px 500px at 70% 10%,#101a28 0%,var(--panel2) 70%)}
  canvas{display:block;width:100%}
  #track{height:420px}
  @media(max-width:820px){#track{height:320px}}
  .modepill{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:12px;
    padding:6px 12px;border-radius:999px;background:#0c1420cc;border:1px solid var(--line);
    backdrop-filter:blur(3px);letter-spacing:.06em}
  .modepill.alarm{border-color:var(--alarm);color:#ffd7de;box-shadow:0 0 0 1px #f43f5e55}
  .clock{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:12px;
    color:var(--muted);background:#0c1420cc;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
  .side{display:flex;flex-direction:column;gap:14px}
  .readout{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .ro{background:var(--panel);padding:13px 14px}
  .ro .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .ro .v{font-family:var(--mono);font-size:22px;margin-top:3px;font-weight:600}
  .ro .u{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
  .ro.alt .v{color:var(--alt)} .ro.spd .v{color:var(--spd)} .ro.bat .v{color:var(--bat)}
  .events{max-height:235px;overflow-y:auto;font-size:12.5px}
  .ev{display:grid;grid-template-columns:52px 16px 1fr;gap:9px;align-items:start;
    padding:7px 13px;border-bottom:1px solid #161f2b;color:var(--muted)}
  .ev:last-child{border-bottom:0}
  .ev .t{font-family:var(--mono);color:var(--faint);text-align:right;font-size:11.5px;padding-top:1px}
  .ev .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--faint)}
  .ev.k-mode .dot{background:var(--accent)} .ev.k-armed .dot{background:var(--ok)}
  .ev.k-disarmed .dot{background:var(--muted)}
  .ev.k-failsafe .dot,.ev.k-error .dot{background:var(--alarm)}
  .ev .x{line-height:1.35}
  .ev.now{background:#172230;color:var(--ink)}
  .ev.past .x{color:#aeb9c7}
  .ev.future{opacity:.45}
  .charts{margin-top:14px}
  #strip{height:260px}
  .controls{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 15px}
  button.play{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);
    background:var(--accent);color:#04121c;font-size:17px;cursor:pointer;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  button.play:hover{filter:brightness(1.1)}
  .scrub{flex:1 1 220px;display:flex;align-items:center;gap:10px}
  input[type=range]{width:100%;accent-color:var(--accent);height:4px}
  .tval{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
  .tval b{color:var(--ink)}
  .rates{display:flex;gap:5px}
  .rate{font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:6px;
    border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
  .rate.on{background:var(--accent);color:#04121c;border-color:var(--accent);font-weight:600}
  .caption{margin-top:20px;color:var(--muted);font-size:13px;line-height:1.6;
    border-left:2px solid var(--accent);padding:4px 0 4px 14px}
  .caption b{color:var(--ink)}
  .legend{display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--muted);padding:0 4px}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:11px;height:3px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
  <div class="head">
    <h1>Flight&nbsp;Log&nbsp;Replay</h1>
    <span class="sub" id="subtitle"></span>
  </div>

  <div class="badges" id="badges"></div>

  <div class="grid">
    <div class="panel trackwrap">
      <div class="cap">Ground track <span>top-down, metres from takeoff</span></div>
      <canvas id="track"></canvas>
      <div class="modepill" id="modepill">--</div>
      <div class="clock" id="clock">T+0.0 s</div>
    </div>

    <div class="side">
      <div class="panel">
        <div class="cap">Telemetry</div>
        <div class="readout">
          <div class="ro alt"><div class="k">Altitude</div><div class="v"><span id="vAlt">0</span><span class="u">m</span></div></div>
          <div class="ro spd"><div class="k">Ground speed</div><div class="v"><span id="vSpd">0</span><span class="u">m/s</span></div></div>
          <div class="ro bat"><div class="k">Battery</div><div class="v"><span id="vBat">0</span><span class="u">V</span></div></div>
          <div class="ro"><div class="k">Distance from home</div><div class="v"><span id="vDist">0</span><span class="u">m</span></div></div>
        </div>
      </div>
      <div class="panel">
        <div class="cap">Flight events <span id="evcount"></span></div>
        <div class="events" id="events"></div>
      </div>
    </div>
  </div>

  <div class="panel charts">
    <div class="cap">Altitude / speed / battery <span class="legend">
      <span><i style="background:var(--alt)"></i>alt (m, above home)</span>
      <span><i style="background:var(--spd)"></i>speed (m/s)</span>
      <span><i style="background:var(--bat)"></i>battery (V)</span>
    </span></div>
    <canvas id="strip"></canvas>
  </div>

  <div class="controls">
    <button class="play" id="play" aria-label="play">&#9654;</button>
    <div class="scrub">
      <input type="range" id="seek" min="0" max="1000" value="0">
    </div>
    <div class="tval">T+<b id="tnow">0.0</b> / <span id="tend">0</span> s</div>
    <div class="rates" id="rates">
      <span class="rate" data-r="1">1x</span>
      <span class="rate on" data-r="2">2x</span>
      <span class="rate" data-r="4">4x</span>
      <span class="rate" data-r="8">8x</span>
    </div>
  </div>

  <p class="caption" id="caption"></p>

<script src="flight.js"></script>
<script>
(function(){
  "use strict";
  const D = window.__FLIGHT__;
  if(!D){ document.body.innerHTML = '<p style="color:#f43f5e;font-family:monospace">flight.js did not load.</p>'; return; }

  // ---- metadata / header ----
  const m = D.meta;
  document.getElementById('subtitle').textContent =
    m.file + ' · ' + m.format.toUpperCase();
  const skipOk = m.skipped_bytes === 0;
  const badges = [
    ['Messages decoded', m.messages.toLocaleString()],
    ['Bytes skipped', (skipOk?'0':m.skipped_bytes.toLocaleString()), skipOk],
    ['Message tables', m.tables],
    ['Parameters', m.params.toLocaleString()],
    ['Duration', m.duration_s.toFixed(1)+' s'],
    ['GPS fixes', D.track.length.toLocaleString()],
  ];
  document.getElementById('badges').innerHTML = badges.map(function(b){
    const v = '<b'+(b[2]?' class="ok"':'')+'>'+b[1]+'</b>';
    return '<span class="badge">'+b[0]+' '+v+'</span>';
  }).join('');

  const T = m.duration_s;
  document.getElementById('tend').textContent = T.toFixed(0);

  // ---- project lat/lon to local metres (ENU from first fix) ----
  const tr = D.track;            // [t, lat, lon, alt]
  const lat0 = tr[0][1], lon0 = tr[0][2];
  const mPerLat = 110540, mPerLon = 111320*Math.cos(lat0*Math.PI/180);
  const P = tr.map(function(p){
    return { t:p[0], e:(p[2]-lon0)*mPerLon, n:(p[1]-lat0)*mPerLat, alt:p[3] };
  });
  let eMin=1e9,eMax=-1e9,nMin=1e9,nMax=-1e9;
  P.forEach(function(p){ if(p.e<eMin)eMin=p.e; if(p.e>eMax)eMax=p.e;
                         if(p.n<nMin)nMin=p.n; if(p.n>nMax)nMax=p.n; });

  // ---- events ----
  const EV = D.events;
  const failsafeT = (EV.find(function(e){ return /failsafe/i.test(e.text)&&(e.kind==='error'||e.kind==='failsafe'); })||{t:Infinity}).t;
  function kindClass(k){ return 'k-'+k; }
  const evHtml = EV.map(function(e,i){
    return '<div class="ev '+kindClass(e.kind)+'" data-i="'+i+'" data-t="'+e.t+'">'+
      '<span class="t">'+e.t.toFixed(1)+'</span><span class="dot"></span>'+
      '<span class="x">'+escapeHtml(e.text)+'</span></div>';
  }).join('');
  document.getElementById('events').innerHTML = evHtml;
  document.getElementById('evcount').textContent = EV.length+' events';
  const evNodes = Array.prototype.slice.call(document.querySelectorAll('.ev'));

  function escapeHtml(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  // ---- series ----
  const S = D.series; // alt_m, speed_ms, volt_v : [[t,v]...]
  function sExtent(a){ let lo=1e9,hi=-1e9; a.forEach(function(p){ if(p[1]<lo)lo=p[1]; if(p[1]>hi)hi=p[1]; }); return [lo,hi]; }
  const ext = { alt:sExtent(S.alt_m), spd:sExtent(S.speed_ms), bat:sExtent(S.volt_v) };
  function sampleAt(a,t){ // linear interp value at time t
    if(!a.length) return null;
    if(t<=a[0][0]) return a[0][1];
    if(t>=a[a.length-1][0]) return a[a.length-1][1];
    let lo=0,hi=a.length-1;
    while(hi-lo>1){ const mid=(lo+hi)>>1; if(a[mid][0]<=t) lo=mid; else hi=mid; }
    const f=(t-a[lo][0])/(a[hi][0]-a[lo][0]||1);
    return a[lo][1]+(a[hi][1]-a[lo][1])*f;
  }
  function posAt(t){ // interpolate E/N/alt along track
    if(t<=P[0].t) return P[0];
    if(t>=P[P.length-1].t) return P[P.length-1];
    let lo=0,hi=P.length-1;
    while(hi-lo>1){ const mid=(lo+hi)>>1; if(P[mid].t<=t) lo=mid; else hi=mid; }
    const a=P[lo],b=P[hi],f=(t-a.t)/(b.t-a.t||1);
    return { e:a.e+(b.e-a.e)*f, n:a.n+(b.n-a.n)*f, alt:a.alt+(b.alt-a.alt)*f };
  }
  function modeAt(t){
    let mode='--';
    for(let i=0;i<EV.length;i++){ if(EV[i].t<=t+1e-6 && EV[i].kind==='mode') mode=EV[i].text; else if(EV[i].t>t) break; }
    return mode;
  }

  // ---- canvas helpers ----
  function setup(cv){
    const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    const r=cv.getBoundingClientRect();
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
    const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w:r.width,h:r.height};
  }

  const trackCv=document.getElementById('track');
  const stripCv=document.getElementById('strip');

  // map world (e,n) -> screen, equal aspect, padded
  function trackMap(w,h){
    const pad=34;
    let dw=eMax-eMin, dh=nMax-nMin;
    const cx=(eMin+eMax)/2, cy=(nMin+nMax)/2;
    dw=Math.max(dw,8); dh=Math.max(dh,8);
    const sx=(w-pad*2)/dw, sy=(h-pad*2)/dh;
    const s=Math.min(sx,sy)*0.92;
    return function(e,n){ return [ w/2+(e-cx)*s, h/2-(n-cy)*s ]; };
  }

  function drawTrack(t){
    const {ctx,w,h}=setup(trackCv);
    ctx.clearRect(0,0,w,h);
    const map=trackMap(w,h);
    const home=map(P[0].e,P[0].n);

    // range rings around home
    const ringStepPx=(function(){ const m=map(P[0].e+20,P[0].n); return Math.abs(m[0]-home[0]); })();
    ctx.strokeStyle='#17202d'; ctx.lineWidth=1;
    for(let r=ringStepPx; r<Math.max(w,h); r+=ringStepPx){
      ctx.beginPath(); ctx.arc(home[0],home[1],r,0,7); ctx.stroke();
    }
    ctx.strokeStyle='#131b26';
    ctx.beginPath(); ctx.moveTo(0,home[1]); ctx.lineTo(w,home[1]);
    ctx.moveTo(home[0],0); ctx.lineTo(home[0],h); ctx.stroke();

    // full path faint
    ctx.strokeStyle='#243346'; ctx.lineWidth=1.5; ctx.beginPath();
    P.forEach(function(p,i){ const s=map(p.e,p.n); i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]); });
    ctx.stroke();

    // flown trail up to t, colour by failsafe state
    ctx.lineWidth=3; ctx.lineJoin='round';
    let started=false; let prev=null;
    for(let i=0;i<P.length;i++){
      if(P[i].t>t) break;
      const s=map(P[i].e,P[i].n);
      if(!started){ ctx.beginPath(); ctx.moveTo(s[0],s[1]); started=true; }
      else {
        ctx.strokeStyle = P[i].t>=failsafeT ? 'rgba(244,63,94,.9)' : 'rgba(56,189,248,.85)';
        ctx.beginPath(); ctx.moveTo(prev[0],prev[1]); ctx.lineTo(s[0],s[1]); ctx.stroke();
      }
      prev=s;
    }

    // home marker
    ctx.fillStyle='#8b98a9';
    ctx.beginPath(); ctx.arc(home[0],home[1],4,0,7); ctx.fill();
    ctx.font='10px '+getComputedStyle(document.body).getPropertyValue('--mono');
    ctx.fillStyle='#5a6676'; ctx.fillText('HOME',home[0]+8,home[1]-7);

    // drone marker
    const pos=posAt(t); const d=map(pos.e,pos.n);
    const alarm=t>=failsafeT;
    ctx.save();
    ctx.shadowColor= alarm?'#f43f5e':'#38bdf8'; ctx.shadowBlur=16;
    ctx.fillStyle= alarm?'#f43f5e':'#38bdf8';
    ctx.beginPath(); ctx.arc(d[0],d[1],6.5,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#04121c'; ctx.beginPath(); ctx.arc(d[0],d[1],2.3,0,7); ctx.fill();

    // N arrow + scale bar
    ctx.fillStyle='#5a6676'; ctx.font='11px '+getComputedStyle(document.body).getPropertyValue('--mono');
    ctx.fillText('N',w-24,22); ctx.strokeStyle='#5a6676'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(w-20,30); ctx.lineTo(w-20,46); ctx.moveTo(w-20,30);
    ctx.lineTo(w-23,35); ctx.moveTo(w-20,30); ctx.lineTo(w-17,35); ctx.stroke();
    const barM=20, barPx=ringStepPx;
    ctx.strokeStyle='#49586a'; ctx.beginPath();
    ctx.moveTo(16,h-18); ctx.lineTo(16+barPx,h-18);
    ctx.moveTo(16,h-21); ctx.lineTo(16,h-15); ctx.moveTo(16+barPx,h-21); ctx.lineTo(16+barPx,h-15);
    ctx.stroke();
    ctx.fillStyle='#5a6676'; ctx.fillText(barM+' m',16,h-24);
  }

  function drawStrip(t){
    const {ctx,w,h}=setup(stripCv);
    ctx.clearRect(0,0,w,h);
    const padL=8,padR=8,padT=10,padB=18;
    const rows=[
      {a:S.alt_m, ext:ext.alt, col:'#60a5fa', lab:'ALT'},
      {a:S.speed_ms, ext:ext.spd, col:'#34d399', lab:'SPD'},
      {a:S.volt_v, ext:ext.bat, col:'#fbbf24', lab:'BAT'},
    ];
    const gh=(h-padT-padB)/rows.length;
    const x=function(tt){ return padL+(tt/T)*(w-padL-padR); };

    // failsafe shaded region (across all rows)
    if(isFinite(failsafeT)){
      ctx.fillStyle='rgba(244,63,94,.07)';
      ctx.fillRect(x(failsafeT),padT,w-padR-x(failsafeT),h-padT-padB);
      ctx.strokeStyle='rgba(244,63,94,.5)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(x(failsafeT),padT); ctx.lineTo(x(failsafeT),h-padB); ctx.stroke();
      ctx.setLineDash([]);
    }

    // event ticks on baseline
    EV.forEach(function(e){
      ctx.strokeStyle = (e.kind==='error'||e.kind==='failsafe')?'rgba(244,63,94,.55)':'rgba(139,152,169,.3)';
      ctx.beginPath(); ctx.moveTo(x(e.t),padT); ctx.lineTo(x(e.t),h-padB); ctx.stroke();
    });

    rows.forEach(function(r,ri){
      const y0=padT+ri*gh, y1=y0+gh-6;
      const lo=r.ext[0], hi=r.ext[1], span=(hi-lo)||1;
      const yy=function(v){ return y1-( (v-lo)/span )*(y1-y0); };
      // zero/baseline
      ctx.strokeStyle='#141c27'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(padL,y1); ctx.lineTo(w-padR,y1); ctx.stroke();
      // full line (dim) then flown portion (bright)
      function plot(limitT,style,wid){
        ctx.strokeStyle=style; ctx.lineWidth=wid; ctx.beginPath(); let st=false;
        for(let i=0;i<r.a.length;i++){ const p=r.a[i]; if(limitT!=null&&p[0]>limitT)break;
          const sx=x(p[0]),sy=yy(p[1]); st?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy); st=true; }
        ctx.stroke();
      }
      plot(null, r.col+'44', 1.2);
      plot(t, r.col, 1.8);
      // current value dot
      const cv=sampleAt(r.a,t);
      if(cv!=null){ ctx.fillStyle=r.col; ctx.beginPath(); ctx.arc(x(t),yy(cv),3,0,7); ctx.fill(); }
      // labels
      ctx.fillStyle='#5a6676'; ctx.font='10px '+getComputedStyle(document.body).getPropertyValue('--mono');
      ctx.fillText(r.lab,padL+2,y0+11);
      const fmt=function(v){ const r=Math.round(v); return (r===0?0:r)+''; };
      ctx.textAlign='right';
      ctx.fillText(fmt(hi),w-padR,y0+11);
      ctx.fillText(fmt(lo),w-padR,y1-2);
      ctx.textAlign='left';
    });

    // playhead
    ctx.strokeStyle='#e6edf3'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x(t),padT); ctx.lineTo(x(t),h-padB); ctx.stroke();

    // time axis ticks
    ctx.fillStyle='#49586a'; ctx.font='10px '+getComputedStyle(document.body).getPropertyValue('--mono');
    for(let s=0;s<=T;s+=30){ ctx.fillText(s+'s',x(s)+2,h-5); }
  }

  // ---- UI state ----
  let cur=0, playing=false, rate=2, lastTs=null;
  const playBtn=document.getElementById('play');
  const seek=document.getElementById('seek');

  function render(){
    drawTrack(cur); drawStrip(cur);
    document.getElementById('clock').textContent='T+'+cur.toFixed(1)+' s';
    document.getElementById('tnow').textContent=cur.toFixed(1);
    seek.value=Math.round(cur/T*1000);
    const alt=sampleAt(S.alt_m,cur), spd=sampleAt(S.speed_ms,cur), bat=sampleAt(S.volt_v,cur);
    const pos=posAt(cur); const dist=Math.sqrt((pos.e-P[0].e)*(pos.e-P[0].e)+(pos.n-P[0].n)*(pos.n-P[0].n));
    document.getElementById('vAlt').textContent=(alt==null?'--':alt.toFixed(1));
    document.getElementById('vSpd').textContent=(spd==null?'--':spd.toFixed(1));
    document.getElementById('vBat').textContent=(bat==null?'--':bat.toFixed(2));
    document.getElementById('vDist').textContent=dist.toFixed(0);
    const mode=modeAt(cur);
    const pill=document.getElementById('modepill');
    const alarm=cur>=failsafeT;
    pill.textContent=(alarm?'⚠ ':'')+mode;
    pill.classList.toggle('alarm',alarm);
    // event highlight
    let activeIdx=-1;
    for(let i=0;i<EV.length;i++){ if(EV[i].t<=cur+1e-6) activeIdx=i; else break; }
    evNodes.forEach(function(nd,i){
      nd.classList.remove('now','past','future');
      if(i===activeIdx) nd.classList.add('now');
      else if(EV[i].t<=cur) nd.classList.add('past');
      else nd.classList.add('future');
    });
    if(playing && activeIdx>=0){ const nd=evNodes[activeIdx];
      const box=nd.parentElement;
      if(nd.offsetTop<box.scrollTop||nd.offsetTop>box.scrollTop+box.clientHeight-30)
        box.scrollTop=nd.offsetTop-box.clientHeight/2; }
  }

  function loop(ts){
    if(!playing) return;
    if(lastTs!=null){ cur+=(ts-lastTs)/1000*rate; if(cur>=T){ cur=T; playing=false; setPlayIcon(); } }
    lastTs=ts; render();
    if(playing) requestAnimationFrame(loop);
  }
  function setPlayIcon(){ playBtn.innerHTML=playing?'&#10073;&#10073;':'&#9654;'; }
  function play(){ if(cur>=T) cur=0; playing=true; lastTs=null; setPlayIcon(); requestAnimationFrame(loop); }
  function pause(){ playing=false; setPlayIcon(); }
  playBtn.onclick=function(){ playing?pause():play(); };
  seek.oninput=function(){ cur=seek.value/1000*T; if(!playing) render(); };
  document.getElementById('rates').onclick=function(e){
    const r=e.target.getAttribute('data-r'); if(!r) return;
    rate=+r; document.querySelectorAll('.rate').forEach(function(n){ n.classList.toggle('on',n===e.target); });
  };
  document.getElementById('events').onclick=function(e){
    const nd=e.target.closest('.ev'); if(!nd) return; cur=+nd.getAttribute('data-t'); if(!playing) render();
  };
  stripCv.onclick=function(e){ const r=stripCv.getBoundingClientRect();
    cur=Math.max(0,Math.min(T,(e.clientX-r.left-8)/(r.width-16)*T)); if(!playing) render(); };
  window.addEventListener('resize',render);
  document.addEventListener('keydown',function(e){ if(e.code==='Space'){ e.preventDefault(); playing?pause():play(); } });

  // caption
  document.getElementById('caption').innerHTML =
    'Every number here was parsed in Rust by <b>flightlog-core</b> from a real ArduPilot DataFlash <b>'+m.file+'</b> log '+
    '(SITL copter, <span style="font-family:var(--mono)">BatteryFailsafeTwoStage</span> autotest). '+
    'The crate read <b>'+m.messages.toLocaleString()+'</b> messages with <b>'+m.skipped_bytes+'</b> bytes skipped, '+
    'and produced the GPS track, the flight events (mode changes, arming, the battery failsafe) and the altitude / speed / battery series straight from the binary. '+
    'Watch the copter climb in ALT_HOLD, the pack sag toward 9.6 V, then the <b style="color:var(--alarm)">battery failsafe</b> force RTL and LAND. '+
    'flightlog-core reads both ArduPilot (.bin / .tlog) and PX4 (.ulg) logs.';

  render();
})();
</script>
</body>
</html>
